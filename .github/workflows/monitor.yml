name: Monitor citas consulado

on:
  schedule:
    - cron: "17 * * * *"   # cada hora al minuto 17 (UTC); luego espera aleatoria
  workflow_dispatch:         # boton "Run workflow" para probar a mano

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Espera aleatoria (0-29 min) -> intervalos de 31 a 89 min
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1740 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Revisar citas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_citas.py --once --headless
