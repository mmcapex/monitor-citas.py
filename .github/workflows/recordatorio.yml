name: Recordatorio citas

on:
  schedule:
    # Horas en UTC. Cancun = UTC-5 todo el año (sin horario de verano)
    - cron: "50 11 * * *"   # 6:50 am Cancun
    - cron: "0 17 * * *"    # 12:00 pm Cancun
    - cron: "0 23 * * *"    # 6:00 pm Cancun
    - cron: "0 2 * * *"     # 9:00 pm Cancun
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Enviar recordatorio
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python recordatorio.py
